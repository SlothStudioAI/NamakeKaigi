<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナマケ会議</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #f3f1ea; color: #222;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 10px 14px; background: #3b5a3a; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  header .room { font-weight: 600; }
  header .state { font-size: 12px; opacity: .85; }
  #list { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { max-width: 92%; margin: 8px 0; padding: 8px 12px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px #0002; }
  .msg.user { margin-left: auto; background: #d9ecd0; }
  .msg.error { background: #fde4e1; }
  .msg .who { font-size: 12px; color: #666; margin-bottom: 2px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .msg .status { font-size: 12px; color: #888; margin-top: 4px; }
  form { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #e6e3d8; }
  textarea { flex: 1; resize: none; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid #bbb; height: 3.2em; }
  button { font: inherit; padding: 0 18px; border: 0; border-radius: 10px; background: #3b5a3a; color: #fff; }
  button:disabled { opacity: .5; }
  #note { padding: 4px 12px; font-size: 12px; color: #a33; min-height: 1.4em; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1f1b; color: #e8e8e8; }
    .msg { background: #2a2e28; } .msg.user { background: #34502f; } .msg.error { background: #5a2b27; }
    .msg .who, .msg .status { color: #aaa; } form { background: #252822; } textarea { background: #1c1f1b; color: #eee; border-color: #555; }
  }
</style>
</head>
<body>
<header><span class="room" id="room">ナマケ会議</span><span class="state" id="state">接続中…</span></header>
<div id="list"></div>
<div id="note"></div>
<form id="form">
  <textarea id="text" placeholder="発言を入力(先頭の「ジェミ、」などで宛先を切り替え)"></textarea>
  <button id="send" type="submit">送信</button>
</form>
<script>
const POLL_MS = __POLL_MS__;
const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
let lastJson = '';

function render(snap) {
  const json = JSON.stringify(snap);
  if (json === lastJson) return;
  lastJson = json;
  const list = $('list');
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  $('room').textContent = snap.room || 'ナマケ会議';
  $('state').textContent = snap.busy ? '返答中…' : '待機中';
  list.replaceChildren(...snap.messages.map(m => {
    const div = document.createElement('div');
    div.className = 'msg' + (m.isUser ? ' user' : '') + (m.isError ? ' error' : '');
    const who = document.createElement('div'); who.className = 'who'; who.textContent = m.name + '  ' + m.time;
    const body = document.createElement('div'); body.className = 'body'; body.textContent = m.text;
    div.append(who, body);
    if (m.streaming && m.status) { const s = document.createElement('div'); s.className = 'status'; s.textContent = m.status; div.append(s); }
    return div;
  }));
  if (nearBottom) list.scrollTop = list.scrollHeight;
}

async function poll() {
  try {
    const r = await fetch('/api/state', { headers: { 'X-Token': token }, cache: 'no-store' });
    if (r.status === 401) { $('state').textContent = '合言葉が違います'; return; }
    render(await r.json());
    $('note').textContent = '';
  } catch (e) { $('state').textContent = 'つながりません(PCとTailscaleを確認)'; }
  setTimeout(poll, POLL_MS);
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('send').disabled = true;
  try {
    const r = await fetch('/api/send', { method: 'POST', headers: { 'X-Token': token, 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (r.ok) { $('text').value = ''; $('note').textContent = ''; lastJson = ''; }
    else $('note').textContent = r.status === 409 ? 'いまは送れません(PC側の会議を確認)' : '送れませんでした(' + r.status + ')';
  } catch (e) { $('note').textContent = '送れませんでした(つながりません)'; }
  $('send').disabled = false;
});
poll();
</script>
</body>
</html>
